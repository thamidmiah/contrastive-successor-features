# ============================================================
# Docker Compose for METRA training
# ============================================================
# 
# Usage:
#   docker compose run --rm train              # Run training
#   docker compose run --rm interactive        # Interactive shell
#   docker compose up tensorboard              # Launch TensorBoard
#
# Make sure nvidia-container-toolkit is installed on host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  # ── Training service ──
  train:
    build: .
    image: metra-csf:latest
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Mount exp/ so results persist on host
      - ./exp:/app/exp
    working_dir: /app
    command: ["bash", "run_montezuma_hex.sh"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - WANDB_API_KEY=${WANDB_API_KEY:-}

  # ── Interactive shell ──
  interactive:
    build: .
    image: metra-csf:latest
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./exp:/app/exp
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["bash"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - WANDB_API_KEY=${WANDB_API_KEY:-}

  # ── TensorBoard viewer ──
  tensorboard:
    build: .
    image: metra-csf:latest
    volumes:
      - ./exp:/app/exp
    ports:
      - "6006:6006"
    command: ["tensorboard", "--logdir=/app/exp", "--host=0.0.0.0", "--port=6006"]
